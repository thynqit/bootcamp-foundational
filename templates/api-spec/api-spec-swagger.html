<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thynqit Labs API Documentation</title>

<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">

<style>
body {
  margin: 0;
  background: #fafafa;
}

.topbar {
  background: #111827;
  color: white;
  padding: 16px 24px;
  font-family: system-ui;
  font-size: 20px;
  font-weight: 600;
}

.subtitle {
  font-size: 13px;
  opacity: 0.8;
}

#swagger-ui {
  margin: 0;
}
</style>
</head>

<body>

<div class="topbar">
  Thynqit Labs API Documentation
  <div class="subtitle">
    Foundational Engineering Bootcamp
  </div>
</div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>

<script>
window.onload = () => {
  SwaggerUIBundle({
    url: "user-api-spec.yaml",
    dom_id: "#swagger-ui",

    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],

    layout: "BaseLayout",

    deepLinking: true,
    showExtensions: true,
    showCommonExtensions: true,

    tryItOutEnabled: true
  });
};
</script>

</body>
</html>
